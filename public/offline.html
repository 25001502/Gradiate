<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>Gradiate | Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 440px);
        padding: 28px;
        border: 1px solid #dbeafe;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 20px 50px rgba(37, 99, 235, 0.12);
      }

      img {
        width: 56px;
        height: 56px;
        display: block;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.7rem, 5vw, 2.2rem);
        line-height: 1.08;
        color: #0f172a;
      }

      p {
        margin: 0 0 22px;
        line-height: 1.6;
        color: #475569;
      }

      button {
        width: 100%;
        min-height: 46px;
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.28);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="offline-title">
      <img src="/icons/icon-192.png" alt="" />
      <h1 id="offline-title">You are offline</h1>
      <p>
        Gradiate can open pages you have already visited, but fresh bursaries, programs, profiles,
        and community updates need an internet connection.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
