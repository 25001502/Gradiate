<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page Not Found | Gradiate</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f3f7ff;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background: linear-gradient(180deg, #eef4ff 0%, #f8fbff 55%, #eefdf7 100%);
      }

      main {
        width: min(100%, 460px);
        padding: 32px;
        border: 1px solid #cfe0f7;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
        text-align: center;
      }

      img {
        display: block;
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
      }

      strong {
        display: block;
        margin-bottom: 8px;
        color: #2563eb;
        font-size: 0.82rem;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        color: #0f172a;
        font-size: clamp(1.8rem, 7vw, 2.5rem);
        line-height: 1.08;
      }

      p {
        margin: 0 0 24px;
        color: #52647d;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        padding: 0 22px;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.28);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="not-found-title">
      <img src="/icons/icon-192.png" alt="" />
      <strong>Error 404</strong>
      <h1 id="not-found-title">Page not found</h1>
      <p>The page may have moved, or the address may be incorrect.</p>
      <a href="/">Return to Gradiate</a>
    </main>
  </body>
</html>
